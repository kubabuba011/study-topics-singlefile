<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700&family=Unbounded:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14163a;
    --cobalt:#2b3bff;
    --pink:#ff8fb8;
    --butter:#ffe27a;
    --paper:#f3efe6;
    --pad:clamp(20px,4vw,48px);
    --display:"Unbounded", "Arial Black", system-ui, sans-serif;
    --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 1px 1px, rgba(243,239,230,.09) 1.5px, transparent 0) 0 0 / 26px 26px,
      var(--ink);
    color:var(--paper);
    font-family:var(--body);
    font-weight:500;
    line-height:1.5;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:0 var(--pad)}

  /* ---------- header ---------- */
  header{padding:clamp(24px,5vw,60px) 0 clamp(16px,3vw,28px)}
  h1{
    margin:0;
    font-family:var(--display);
    font-weight:900;
    font-size:clamp(2.8rem,10.5vw,7.5rem);
    line-height:.92;
    letter-spacing:-.04em;
    color:var(--paper);
    text-shadow:.045em .045em 0 var(--cobalt);
  }
  .sub{margin:18px 0 0;max-width:34ch;font-size:1.1rem;color:rgba(243,239,230,.8)}

  /* ---------- sticky controls ---------- */
  .controls{
    position:sticky;top:0;z-index:5;
    margin:0 calc(-1 * var(--pad));
    padding:12px var(--pad) 4px;
    background:var(--ink);
    border-bottom:2px solid rgba(243,239,230,.12);
  }
  .bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:0 0 10px}
  .search{
    flex:1 1 260px;max-width:460px;
    font:inherit;font-weight:700;color:var(--ink);
    background:var(--paper);
    border:3px solid var(--paper);
    border-radius:14px;
    padding:10px 16px;
    box-shadow:5px 5px 0 var(--pink);
  }
  .search::placeholder{color:rgba(20,22,58,.55);font-weight:500}
  .btn{
    font:inherit;font-weight:700;color:var(--ink);
    background:var(--butter);
    border:3px solid var(--paper);
    border-radius:14px;
    padding:10px 20px;
    cursor:pointer;
    box-shadow:5px 5px 0 var(--cobalt);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--cobalt)}
  .count{margin-left:auto;font-weight:700;color:rgba(243,239,230,.75)}

  .chips{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 12px;scrollbar-width:thin}
  .chip{
    flex:none;
    font:inherit;font-weight:700;font-size:.92rem;
    color:var(--paper);
    background:transparent;
    border:2px solid rgba(243,239,230,.4);
    border-radius:999px;
    padding:5px 14px;
    cursor:pointer;
  }
  .chip small{margin-left:6px;font-size:.8em;font-weight:500;opacity:.7}
  .chip[aria-pressed="true"]{
    background:var(--butter);
    color:var(--ink);
    border-color:var(--paper);
    box-shadow:3px 3px 0 var(--pink);
  }
  .chip:hover:not([aria-pressed="true"]){border-color:var(--paper)}

  .search:focus-visible,.btn:focus-visible,.chip:focus-visible,.zg-card:focus-visible,.mg-card:focus-visible{outline:3px solid var(--butter);outline-offset:3px}

  .status{margin:28px 0;font-size:1.05rem;max-width:56ch}
  .status[hidden]{display:none}
  .status b{color:var(--butter)}

  /* ---------- the games wall (rules the loader matches onto its own classes) ---------- */
  .zg-grid, .mg-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:26px 22px;
    padding:26px 8px 56px 0;
  }
  .zg-card, .mg-card{
    appearance:none;
    padding:0;
    margin:0;
    text-align:left;
    cursor:pointer;
    font-family:var(--body);
    background:var(--paper);
    border:3px solid var(--paper);
    border-radius:14px;
    overflow:hidden;
    box-shadow:6px 6px 0 var(--cobalt);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .zg-card:hover, .mg-card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--pink)}
  .zg-card:active, .mg-card:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--pink)}
  .zg-cover, .mg-cover{
    display:block;
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    background:var(--cobalt);
  }
  .zg-title, .mg-title{
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    padding:9px 11px 11px;
    color:var(--ink);
    font-weight:700;
    font-size:.88rem;
    line-height:1.25;
  }


  .mg-letter{
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:900;font-size:3.4rem;
  }
  /* only visible if the games script fails to load; otherwise your games sit inside its grid */
  #mine:empty{display:none}

  /* ---------- full-screen player ---------- */
  .player{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#000}
  .player[hidden]{display:none}
  .player-bar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--ink);border-bottom:2px solid rgba(243,239,230,.15)}
  #playerTitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:.95rem}
  .btn.small{padding:5px 14px;font-size:.9rem;box-shadow:3px 3px 0 var(--cobalt)}
  #pFrame{flex:1;width:100%;border:0;background:#000}

  @media (prefers-reduced-motion:reduce){
    .btn,.zg-card,.mg-card{transition:none}
  }
</style>
</head>

dn.jsdelivr.net/gh/bubblfan/emu@master/loader.js\";\n        document.body.appendChild(script);\n        var script = document.createElement(\"script\");\n        script.src =\n          \"https://cdn.jsdelivr.net/gh/a456pur/seraph@ae2fcc6d6a9cd051654fcc0519080db1f79cf2a7/storage/js/cloak.js\";\n        document.body.appendChild(script);\n      }\n    \u003c/script>\n  \u003c/body>\n\u003c/html>\n", "games/gta3.html": "\u003c!-- This is an Ultimate game stash file -->\n\u003c!-- for regular updating go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/edit?usp=sharing -->\n\n\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n    \u003cbase href=\"https://cdn.jsdelivr.net/gh/larpinguser/HelloWorldScriptBasicFunctionCSharpIsCool@main/\">\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>GTA III\u003c/title>\n\u003cstyle>\n  body {\n    margin: 0;\n    background: #000;\n    display: flex;\n    justify-content: center;\n    align-items: center;\n    height: 100vh;\n    overflow: hidden;\n  }\n  canvas.emscripten {\n    display: block;\n    width: min(100vw, calc(100vh * 16 / 9));\n    height: min(100vh, calc(100vw * 9 / 16));\n    image-rendering: auto;\n  }\n  #loading {\n    color: #fff;\n    font: 14px monospace;\n    position: absolute;\n    top: 50%;\n    left: 50%;\n    transform: translate(-50%, -50%);\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"loading\">Loading GTA III...\u003c/div>\n\u003cscript>\n  window.addEventListener('unhandledrejection', function(e) {\n    if (e.reason && e.reason.name && e.reason.name.indexOf('DocumentError') !== -1) {\n      e.preventDefault();\n      return;\n    }\n    document.getElementById('loading').textContent = 'ERR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);\n  });\n  (function() {\n    var _rpl = Element.prototype.requestPointerLock;\n    if (_rpl) Element.prototype.requestPointerLock = function() {\n      try { var p = _rpl.call(this); if (p && p.catch) p.catch(function(){}); return p; }\n      catch(e) {}\n    };\n  })();\n\u003c/script>\n\u003cscript>\n  (function() {\n    var ORIG_FETCH = window.fetch;\n    window.fetch = function(url, opts) {\n      if (typeof url === 'string' && /re3\\.data$/i.test(url) && !/\\.(chunk|part)/.test(url)) {\n        return loadDataParts();\n      }\n      return ORIG_FETCH.call(this, url, opts);\n    };\n    async function loadDataParts() {\n      var parts = [];\n      for (var i = 0; ; i++) {\n        var resp = await ORIG_FETCH.call(window, 're3.chunk.' + i);\n        if (!resp.ok) break;\n        parts.push(await resp.arrayBuffer());\n      }\n      var total = parts.reduce(function(s, p) { return s + p.byteLength; }, 0);\n      var combined = new Uint8Array(total);\n      var offset = 0;\n      for (var pi = 0; pi \u003c parts.length; pi++) {\n        combined.set(new Uint8Array(parts[pi]), offset);\n        offset += parts[pi].byteLength;\n      }\n      return new Response(combined, {\n        status: 200,\n        headers: { 'Content-Type': 'application/octet-stream' }\n      });\n    }\n    var origGetContext = HTMLCanvasElement.prototype.getContext;\n    HTMLCanvasElement.prototype.getContext = function(type, attrs) {\n      if (type.indexOf('webgl') === 0 || type.indexOf('experimental-webgl') === 0) {\n        attrs = Object.assign({}, attrs || {}, { preserveDrawingBuffer: true });\n      }\n      return origGetContext.call(this, type, attrs);\n    };\n  })();\n\n  Element.prototype.requestFullscreen =\n  Element.prototype.webkitRequestFullscreen = function() {\n    return Promise.reject(new DOMException(\"blocked\"));\n  };\n  document.exitFullscreen =\n  document.webkitExitFullscreen = function() {};\n  Object.defineProperty(document, 'fullscreenElement', {\n    get: function() { return null; }\n  });\n  Object.defineProperty(document, 'webkitFullscreenElement', {\n    get: function() { return null; }\n  });\n  Object.defineProperty(document, 'fullscreenEnabled', {\n    get: function() { return false; }\n  });\n  Object.defineProperty(document, 'webkitFullscreenEnabled', {\n    get: function() { return false; }\n  });\n\n  (function() {\n    var RealAC = window.AudioContext || window.webkitAudioContext;\n    if (!RealAC) return;\n    var contexts = [];\n    function resumeAll() {\n      for (var i = 0; i \u003c contexts.length; i++) {\n        var ctx = contexts[i];\n        if (ctx.state === 'suspended') ctx.resume();\n      }\n    }\n    document.addEventListener('click', resumeAll);\n    document.addEventListener('touchstart', resumeAll);\n    document.addEventListener('keydown', resumeAll);\n    var Wrapper = function(options) {\n      var ctx = new RealAC(options);\n      contexts.push(ctx);\n      if (ctx.state === 'suspended') ctx.resume().catch(function(){});\n      return ctx;\n    };\n    Wrapper.prototype = RealAC.prototype;\n    window.AudioContext = Wrapper;\n    if (window.webkitAudioContext) window.webkitAudioContext = Wrapper;\n  })();\n\u003c/script>\n\u003cscript>\n  var Module = {\n    preRun: [],\n    postRun: [],\n    canvas: (function() {\n      var canvas = document.getElementById('canvas');\n      if (!canvas) {\n        canvas = document.createElement('canvas');\n        canvas.id = 'canvas';\n        canvas.className = 'emscripten';\n        document.body.appendChild(canvas);\n      }\n      return canvas;\n    })(),\n    setStatus: function(text) {\n      var loading = document.getElementById('loading');\n      if (loading) loading.textContent = text;\n    },\n    totalDependencies: 0,\n    monitorRunDependencies: function(left) {\n      this.totalDependencies = Math.max(this.totalDependencies, left);\n      Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');\n    }\n  };\n  Module.setStatus('Loading...');\n\u003c/script>\n\u003cscript src=\"re3.js\">\u003c/script>\n\u003c/body>\n\u003c/html>", "games/gtachina.html": "\u003chtml>\n  \u003c!-- Ultimate Game Stash file-->\n  \u003c!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->\n\n  \u003chead>\n    \u003cscript>\n      window.gameconfig = {\n        name: \"Grand Theft Auto - Chinatown Wars (USA)\",\n        url: \"https://cdn.jsdelivr.net/gh/bubbls/ugss@f8e74f824068a8b40cc6e091567fe1e4c65656d4/Grand%20Theft%20Auto%20-%20Chinatown%20Wars%20(USA)%20(En%2CFr%2CDe%2CEs%2CIt)/Grand%20Theft%20Auto%20-%20Chinatown%20Wars%20(USA)%20(En%2CFr%2CDe%2CEs%2CIt).nds\",\n        core: \"nds\",\n        min: 1,\n        max: 7,\n      };\n    \u003c/script>\n    \u003cscript>\n      function mergeFiles(fileParts, cb) {\n        return new Promise((resolve, reject) => {\n          let buffers = [];\n          function fetchPart(index) {\n            if (index >= fileParts.length) {\n              let mergedBlob = new Blob(buffers);\n              let mergedFileUrl = URL.createObjectURL(mergedBlob);\n              resolve(mergedFileUrl);\n              return;\n            }\n            fetch(fileParts[index])\n              .then((response) => response.arrayBuffer())\n              .then((data) => {\n                buffers.push(data);\n                fetchPart(index + 1);\n              })\n              .catch(reject);\n            cb(index);\n          }\n          fetchPart(0);\n        });\n      }\n      function getParts(file, start, end) {\n        let parts = [];\n        for (let i = start; i \u003c= end; i++) {\n          parts.push(file + \".part\" + i);\n        }\n        return parts;\n      }\n    \u003c/script>\n    \u003cstyle>\n      body,\n      html {\n        margin: 0;\n        padding: 0;\n        display: flex;\n        align-items: center;\n        justify-content: center;\n        width: 100%;\n        height: 100%;\n        background-color: #121212;\n        color: white;\n        font-family: Arial, sans-serif;\n      }\n      #game-container {\n        text-align: center;\n        width: 100%;\n        height: 100%;\n      }\n      #loading-progress {\n        font-size: 18px;\n        margin-top: 20px;\n        padding: 10px;\n        background: rgba(255, 255, 255, 0.1);\n        border-radius: 8px;\n        display: inline-block;\n      }\n    \u003c/style>\n  \u003c/head>\n  \u003cbody>\n    \u003cdiv id=\"game-container\">\n      \u003cdiv id=\"game\">\u003c/div>\n      \u003cdiv id=\"loading-progress\">Loading: 0/0\u003c/div>\n      \u003cdiv id=\"first-time\">First-time loading may take longer...\u003c/div>\n    \u003c/div>\n    \u003cscript>\n      var parts = getParts(\n        window.gameconfig.url,\n        window.gameconfig.min,\n        window.gameconfig.max,\n      );\n      var totalParts = parts.length;\n\n      function updateLoadingProgress(loaded) {\n        const progressElement = document.getElementById(\"loading-progress\");\n        if (loaded === 0) {\n          progressElement.textContent = \"Loading: 0/0\";\n        } else {\n          progressElement.textContent = `Loading: ${loaded}/${totalParts}`;\n        }\n      }\n\n      Promise.all([mergeFiles(parts, updateLoadingProgress)])\n        .then(([gameUrl]) => {\n          document.getElementById(\"loading-progress\").remove();\n          document.getElementById(\"first-time\").remove();\n          EJS_player = \"#game\";\n          EJS_core = window.gameconfig.core;\n          EJS_gameName = window.gameconfig.name;\n          EJS_color = \"#0064ff\";\n          EJS_startOnLoaded = true;\n          EJS_pathtodata = \"https://cdn.jsdelivr.net/gh/bubblfan/emu@master/\";\n          EJS_gameUrl = gameUrl;\n          const script = document.createElement(\"script\");\n          script.src =\n            \"https://cdn.jsdelivr.net/gh/bubblfan/emu@master/loader.js\";\n          document.body.appendChild(script);\n        })\n        .catch((error) => {\n          console.error(error);\n          document.getElementById(\"loading-progress\").textContent =\n            \"Error loading game.\";\n        });\n    \u003c/script>\n  \u003c/body>\n\u003c/html>\n"};

  var MY_GAMES = [
    { title: 'GTA',       file: 'games/gta.html',      category: 'Port' },

    // { title: 'My Puzzle', file: 'games/my-puzzle.html', category: 'Puzzle|Arcade', cover: 'games/my-puzzle.png' },

  /* ------------------------------------------------------------------
     CATEGORIES for the catalog games
     The games script does not hand over genres, so each game is sorted
     by keywords in its title. Order matters: first match wins.

       "Slope": "Racing"

  var CATEGORY_OVERRIDES = {
    // "Exact Game Title": "Puzzle",
  };
  var RULES = [
    ['Horror',     /horror|fnaf|five nights|scary|haunted|backroom|nightmare|ghost|granny|slender|creepy/i],
    ['Shooter',    /shoot|\bguns?\b|sniper|strike|warfare|\bwar\b|zombie|bullet|battle royale|krunker|shell shockers|\bfps\b|rifle|soldier|commando|combat|mercenar|1v1|surviv\.io|paintball/i],
    ['Racing',     /\brac(e|er|ing)\b|drift|\bcars?\b|truck|moto|\bbikes?\b|rider|rally|\bkart|parking|\bdrive|driver|burnout|slope|traffic/i],
    ['Sports',     /soccer|football|basketball|baseball|golf|tennis|hockey|bowling|\bsports?\b|boxing|wrestl|\bpool\b|billiard|\bski|snowboard|skate|surf|volleyball|cricket|rugby|darts|archery|fifa|nba|penalty|retro bowl/i],
    ['Puzzle',     /puzzle|2048|sudoku|tetris|match|block|merge|solitaire|mahjong|word|crossword|jigsaw|escape|brain|logic|bubble|connect|\bsort|maze|cut the rope|unblock|tile/i],
    ['Platformer', /platform|mario|jump|\brun(ner)?\b|parkour|obby|geometry dash|climb|bounce|sonic|ninja|fireboy|watergirl|adventure/i],
    ['Strategy',   /strategy|tower|defen[cs]e|tycoon|empire|kingdom|civiliz|chess|checkers|clash|\brts\b|simulator|idle|clicker|cookie|farm|\bcity\b|builder|manage|bitlife|craft/i],
    ['Action',     /fight|battle|brawl|sword|knight|kombat|stick|ragdoll|assassin|hero|warrior|smash|survival|dungeon|rpg|quest/i]
  ];
  var PALETTE = [['#2b3bff', '#f3efe6'], ['#ff8fb8', '#14163a'], ['#ffe27a', '#14163a'], ['#7be0c3', '#14163a']];

  // 'Port|Shooter' or ['Port', 'Shooter'] -> ['Port', 'Shooter'] (no repeats, first letter capitalized)
  function parseCats(v) {
    var list = Array.isArray(v) ? v : String(v == null ? '' : v).split('|');
    var out = [];
    list.forEach(function (c) {
      c = String(c).trim();
      if (!c) return;
      c = c.charAt(0).toUpperCase() + c.slice(1);
      if (out.indexOf(c) === -1) out.push(c);
    });
    return out.length ? out : ['Other'];
  }

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !player.hidden) closeGame(); });

  /* ---------- my game cards ---------- */
  function hashOf(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
  var mine = MY_GAMES.map(function (g) {
    var card = document.createElement('button');

    card.className = 'mg-card';

    if (g.cover) {

    card.addEventListener('click', function (e) { e.stopPropagation(); openGame(g); });
    mineEl.appendChild(card);
    return { card: card, title: g.title, cats: parseCats(g.category) };
  });

  /* ---------- catalog cards from the games script ---------- */
  // The loader scrambles class names; the live ones are on window.ZenGS.classes.
  function sel(name, fallback) {
    var c = window.ZenGS && window.ZenGS.classes && window.ZenGS.classes[name];
    return c ? '.' + String(c).trim().split(/\s+/).join('.') : fallback;
  }
  function cards() { return Array.prototype.slice.call(wall.querySelectorAll(sel('card', '.zg-card'))); }
  function titleOf(card) {
    var t = card.querySelector(sel('title', '.zg-title'));
    var s = (t ? t.textContent : card.textContent).trim();
    if (!s) {
      var img = card.querySelector('img');
      s = (card.getAttribute('aria-label') || card.getAttribute('title') || (img && img.alt) || '').trim();
    }
    return s;
  }
  // If the loader happens to expose genre data, use it before guessing from titles.
  function remoteCats() {
    var map = {}, z = window.ZenGS;
    if (!z) return map;
    Object.keys(z).forEach(function (k) {
      var v = z[k];
      if (!Array.isArray(v)) return;
      v.forEach(function (g) {
        if (!g || g.id == null) return;
        var c = g.category || g.genre || (g.tags && g.tags[0]);
        if (c && typeof c !== 'object') {
          c = String(c);
          map[String(g.id)] = c.charAt(0).toUpperCase() + c.slice(1);
        }
      });
    });
    return map;
  }
  function categoryOf(card, title, remote) {
    if (CATEGORY_OVERRIDES[title]) return CATEGORY_OVERRIDES[title];
    var id = card.getAttribute('data-id');
    if (id && remote[id]) return remote[id];
    for (var i = 0; i < RULES.length; i++) if (RULES[i][1].test(title)) return RULES[i][0];
    return 'Other';
  }

  /* ---------- search ---------- */
  // Ignores case, accents and punctuation. Every word you type must match.
  // Matches word starts, text inside words, "geometrydash" for "geometry dash",
  // the category name, and small typos. Best matches come first.
  function norm(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/\p{M}/gu, '')
      .replace(/&/g, ' and ').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  }
  function lev(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    var prev = [], cur, i, j, rowMin;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      cur = [i]; rowMin = i;
      for (j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
        if (cur[j] < rowMin) rowMin = cur[j];
      }
      if (rowMin > max) return max + 1;
      prev = cur;
    }
    return prev[b.length];
  }
  var prepCache = {};
  function prep(it) {
    var c = prepCache[it.title];
    if (!c) {
      var n = norm(it.title);
      c = prepCache[it.title] = { n: n, words: n.split(' '), compact: n.replace(/ /g, '') };
    }
    it.n = c.n; it.words = c.words; it.compact = c.compact; it.c = ' ' + norm(it.cats.join(' '));
  }
  function scoreItem(it, tokens) {
    if (it.n === undefined) prep(it);
    var total = 0;
    for (var k = 0; k < tokens.length; k++) {
      var t = tokens[k], best = 0;
      if (it.n.indexOf(t) === 0) best = 100;
      else if (it.words.some(function (w) { return w.indexOf(t) === 0; })) best = 80;
      else if (it.n.indexOf(t) !== -1) best = 60;
      else if (it.compact.indexOf(t) !== -1) best = 50;
      else if (it.c.indexOf(' ' + t) !== -1) best = 12;
      else {
        var max = t.length >= 6 ? 2 : 1;
        for (var w = 0; w < it.words.length && !best; w++) {
          var word = it.words[w];
          if (t.length >= 4 && (lev(t, word, max) <= max || lev(t, word.slice(0, t.length), max) <= max)) best = 30;
          else if (t.length >= 3 && word.charAt(0) === t.charAt(0)) {
            // letters typed in order, e.g. "dsh" finds "dash"
            var pos = 0;
            for (var c = 0; c < word.length && pos < t.length; c++) if (word.charAt(c) === t.charAt(pos)) pos++;
            if (pos === t.length) best = 20;
          }
        }
      }
      if (!best) return 0;
      total += best;
    }
    return total - Math.min(it.n.length, 60) * 0.01;
  }

  /* ---------- chips + filtering ---------- */
  function buildChips(counts, total) {
    var names = Object.keys(counts).sort(function (a, b) {
      if (a === 'Other') return 1;
      if (b === 'Other') return -1;
      return counts[b] - counts[a];
    });
    var sig = JSON.stringify(counts) + '|' + total + '|' + active;
    if (sig === chipSig) return;
    chipSig = sig;
    chipsEl.textContent = '';
    var list = [['All', total]];
    names.forEach(function (n) { list.push([n, counts[n]]); });
    list.forEach(function (it) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.setAttribute('data-cat', it[0]);
      b.setAttribute('aria-pressed', it[0] === active ? 'true' : 'false');
      b.appendChild(document.createTextNode(it[0]));
      var n = document.createElement('small');
      n.textContent = it[1];
      b.appendChild(n);
      chipsEl.appendChild(b);
    });
  }

  // Move my games into the games script's grid so everything is one catalog.
  function placeMine() {
    var grid = wall.querySelector(sel('grid', '.zg-grid'));
    if (!grid) return;
    for (var i = mine.length - 1; i >= 0; i--) {
      if (mine[i].card.parentNode !== grid) grid.insertBefore(mine[i].card, grid.firstChild);
    }
  }

  function apply() {
    scheduled = false;
    placeMine();
    var loaderCards = cards();
    if (!loaderCards.length && !mine.length) return;
    var remote = remoteCats();
    var info = loaderCards.map(function (card) {
      var title = titleOf(card);
      return { card: card, title: title, cats: parseCats(categoryOf(card, title, remote)) };
    }).concat(mine);

    var counts = {};
    info.forEach(function (it) { it.cats.forEach(function (c) { counts[c] = (counts[c] || 0) + 1; }); });
    if (active !== 'All' && !counts[active]) active = 'All';
    buildChips(counts, info.length);

    var tokens = norm(q.value).split(' ').filter(Boolean);
    var shown = 0, hits = [];
    info.forEach(function (it) {
      var inCat = active === 'All' || it.cats.indexOf(active) !== -1;
      it.score = inCat ? (tokens.length ? scoreItem(it, tokens) : 1) : 0;
      var ok = it.score > 0;
      it.card.style.display = ok ? '' : 'none';
      if (ok) { shown++; hits.push(it); }
    });
    if (tokens.length) {
      hits.sort(function (a, b) { return b.score - a.score; });
      hits.forEach(function (it, i) { it.card.style.order = i; });
      topCard = hits.length ? hits[0].card : null;
    } else {
      info.forEach(function (it) { it.card.style.order = ''; });
      topCard = null;
    }
    status.hidden = !!shown;
    if (!shown) status.textContent = 'No games match that. Try fewer or shorter words.';
    count.textContent = shown === info.length ? info.length + ' games' : shown + ' of ' + info.length + ' games';
  }
  function schedule() { if (!scheduled) { scheduled = true; requestAnimationFrame(apply); } }

  new MutationObserver(schedule).observe(wall, { childList: true, subtree: true });
  q.addEventListener('input', function () {
    // Searching always looks through every game, so drop any category filter.
    if (q.value.trim() && active !== 'All') { active = 'All'; chipSig = ''; }
    schedule();
  });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && topCard) topCard.click();
    if (e.key === 'Escape' && q.value) { q.value = ''; schedule(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && player.hidden && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });
  chipsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    active = b.getAttribute('data-cat');
    chipSig = '';
    schedule();
    window.scrollTo({ top: 0 });
  });
  rnd.addEventListener('click', function () {
    var pool = cards().concat(mine.map(function (m) { return m.card; }))
      .filter(function (c) { return c.style.display !== 'none'; });
    if (pool.length) pool[Math.floor(Math.random() * pool.length)].click();
  });

  schedule();
  setTimeout(function () {
    if (!cards().length && !mine.length) {
      status.hidden = false;
      status.textContent = 'No games loaded. Check that you are online, that an ad blocker is not blocking the games script, and that you opened the site from its web address and not as a local file.';
    }
  }, 8000);
})();
</script>
</body>
</html>
